include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/utils/release-utils.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/stages.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/license-scan.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/python-linters.yml"

variables:
  # Give uv a project-relative cache dir so the cache: block below actually
  # persists it across jobs (uv's default cache is outside $CI_PROJECT_DIR and
  # cannot be cached by GitLab).
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files:
      - uv.lock
  # Without `paths:` this cache block was a no-op — nothing was ever stored or
  # restored, so every job re-ran `pip install uv` + `uv sync` cold.
  paths:
    - .uv-cache

.build_before_script: &build_before_script
  - echo "[+] Adding SSH keys to the home directory"
  - mkdir -p ~/.ssh
  - cat "$SSH_JENKINS_GITHUB_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
  - cat "$SSH_JENKINS_GITHUB_PUBLIC_KEY" | tr -d '\r' > ~/.ssh/id_rsa.pub
  - chmod 600 ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa.pub
  - ssh-keygen -lf ~/.ssh/id_rsa.pub
  - ssh-keyscan -H "github.com" >> ~/.ssh/known_hosts
  - git config --global user.name "$GITLAB_USER_NAME"
  - git config --global user.email "$GITLAB_USER_EMAIL"

.base_job:
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  stage: test
  interruptible: true
  variables:
    RELEASE_VERSION: ""
  rules:
    # Skip tests if said so
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    # If tagged release
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    # If event is related to a created merge request
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # If triggered from waldur-docs pipeline
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    # Manually triggered via CI/CD -> Run pipeline
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs: []
  before_script:
    - apt-get update
    - pip install uv
    - uv sync --frozen

# Shared gating for repo test jobs (linters, unit, collection tests): run on
# main, semver tags and MRs; never on docs-triggered (pipeline) runs or when
# SKIP_TESTS is set. Referenced via `!reference` to keep a single source of truth
# instead of copying this block into every test job.
.test_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: never
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

Run linters:
  extends: .Run linters template
  needs: []
  rules: !reference [.test_rules, rules]

Run unit tests:
  extends: .base_job
  needs: []
  rules: !reference [.test_rules, rules]
  before_script:
    - pip install uv
  script:
    - uv run pytest ansible_waldur_generator/tests/unit/ --junitxml=unit_report.xml --cov=ansible_waldur_generator --cov-report=xml --cov-report=term-missing
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: unit_report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'

Fetch OpenAPI schema:
  extends: .fetch-openapi-schema
  # Transient upstream 404/5xx from the waldur-docs repository tree API used to
  # hard-fail the whole pipeline with no retry budget.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - script_failure
  variables:
    OPENAPI_SCHEMA_DEST: "inputs/waldur_api.yaml"

Generate Collection:
  extends: .base_job
  needs:
    - job: Fetch OpenAPI schema
      artifacts: true
  script:
    - apt-get update && apt-get install -y git jq
    - pip install yq
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        RELEASE_VERSION="$CI_COMMIT_TAG"
        echo "Building stable release version: $RELEASE_VERSION"
      elif [ -n "$RELEASE_VERSION" ]; then
        RELEASE_VERSION="$RELEASE_VERSION"
        echo "Building stable release version from docs trigger: $RELEASE_VERSION"
      else
        API_VERSION=$(yq -r '.info.version // empty' inputs/waldur_api.yaml 2>/dev/null || echo "0.0.0")
        if [ "$API_VERSION" = "0.0.0" ]; then
          git fetch --tags || true
          API_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
        fi
        # The schema's info.version already carries a dev stamp when it comes
        # from a mastermind develop build (e.g. 8.1.0-rc.18.dev.20260724073821).
        # Stamping it a second time pushes the version past the 32 characters
        # Galaxy stores it in, which surfaces only as an opaque HTTP 500 at
        # publish time, so drop any stamp that is already there.
        API_VERSION="${API_VERSION%%.dev.*}"
        API_VERSION="${API_VERSION%%-dev.*}"
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        case "$API_VERSION" in
          *-*) RELEASE_VERSION="${API_VERSION}.dev.${TIMESTAMP}" ;;
          *)   RELEASE_VERSION="${API_VERSION}-dev.${TIMESTAMP}" ;;
        esac
        echo "Base API version resolved: $API_VERSION"
        echo "Building development release version: $RELEASE_VERSION"
      fi

      # Fail here rather than at publish time, where exceeding Galaxy's limit
      # is reported as an unexplained server error.
      if [ ${#RELEASE_VERSION} -gt 32 ]; then
        echo "ERROR: version '$RELEASE_VERSION' is ${#RELEASE_VERSION} characters; Ansible Galaxy accepts at most 32." >&2
        exit 1
      fi

      echo "Updating inputs/generator_config.yaml to version $RELEASE_VERSION"
      yq -iy '.collections[].version = "'$RELEASE_VERSION'"' inputs/generator_config.yaml

      echo "--- Updated inputs/generator_config.yaml ---"
      cat inputs/generator_config.yaml
      echo "-------------------------------------------"

      uv run ansible-waldur-generator --config inputs/generator_config.yaml --api-spec inputs/waldur_api.yaml --output-dir outputs/
  artifacts:
    # Consumed by the downstream 'Test Collection *' jobs via needs:.
    expire_in: 1 week
    paths:
      - outputs/

# Primary e2e run in the generator's own environment (requires Python >=3.11).
Test Collection 3.13:
  extends: .base_job
  needs: ["Generate Collection"]
  rules: !reference [.test_rules, rules]
  script:
    - uv run pytest ansible_waldur_generator/tests/e2e/ --junitxml=e2e_report.xml --vcr-record=none
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: e2e_report.xml

# Compatibility smoke-test of the GENERATED collection under older interpreters
# with only ansible-core installed. The generator itself requires Python >=3.11,
# so these deliberately do NOT `uv sync` — they mirror a real end-user runtime.
# One matrix cell per interpreter; add a version by adding a matrix entry.
Test Collection compat:
  extends: .base_job
  image: "$IMAGE"
  needs: ["Generate Collection"]
  rules: !reference [.test_rules, rules]
  parallel:
    matrix:
      - PYTHON_VERSION: "3.12"
        IMAGE: "registry.hpc.ut.ee/mirror/library/python:3.12-bookworm"
        ANSIBLE_CORE: "ansible-core"
      - PYTHON_VERSION: "3.11"
        IMAGE: "registry.hpc.ut.ee/mirror/library/python:3.11-bookworm"
        ANSIBLE_CORE: "ansible-core"
      - PYTHON_VERSION: "3.9"
        IMAGE: "registry.hpc.ut.ee/mirror/library/python:3.9-bullseye"
        ANSIBLE_CORE: "ansible-core<2.16"
  before_script:
    - python --version
    - pip install uv
    - uv pip install --system "$ANSIBLE_CORE" pytest pytest-vcr
  script:
    - export PYTHONPATH=$PYTHONPATH:$(pwd):$(pwd)/outputs
    - pytest ansible_waldur_generator/tests/e2e/ --junitxml="e2e_report_${PYTHON_VERSION}.xml" --vcr-record=none
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: "e2e_report_${PYTHON_VERSION}.xml"

Generate Collection Changelog:
  stage: deploy
  extends: .base_job
  rules:
    # Run for schedules, web, pipeline triggers, and commits to main
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update && apt-get install -y git jq
  script:
    - echo "Cloning the Ansible module repository..."
    - git clone --depth 1 --branch main https://github.com/waldur/ansible-waldur-module-next.git /tmp/ansible-module-old
    - cd /tmp/ansible-module-old

    - |
      # Determine version for changelog title and the baseline for comparison
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      elif [ -n "$RELEASE_VERSION" ]; then
        VERSION="$RELEASE_VERSION"
      else
        VERSION="develop"
      fi

      echo "Resolved Version: $VERSION"

      if [ "$VERSION" != "develop" ]; then
        echo "Finding previous stable tag for comparison."
        git fetch --tags origin
        # `grep` exits 1 when $VERSION is not among this repo's tags, and job
        # scripts run under `set -e` with pipefail, so the unguarded pipeline
        # aborted the job before the fallback below could run — that is what
        # failed the 8.1.0 release here. A missing $VERSION is the normal case,
        # not an error: ansible-waldur-module-next is tagged separately and
        # lags the platform release (its highest tag is 7.8.7).
        PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -A 1 -x -F "$VERSION" | tail -n 1 || true)

        if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" == "$VERSION" ]; then
          # $VERSION is not tagged here, so fall back to the highest tag below
          # it. Diffing against the initial commit instead would report every
          # module in the collection as newly added.
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -v -x -F "$VERSION" | head -n 1 || true)
        fi

        if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" == "$VERSION" ]; then
          echo "Warning: Could not find a previous tag. Will compare against the initial commit."
          BASELINE_COMMIT=$(git rev-list --max-parents=0 HEAD)
        else
          echo "Found previous tag: $PREVIOUS_TAG. Using it as the baseline."
          BASELINE_COMMIT=$PREVIOUS_TAG
        fi
        git checkout $BASELINE_COMMIT
      else
        echo "This is a develop branch build. Comparing against the latest main branch."
      fi

    - cd $CI_PROJECT_DIR
    - echo "Generating changelogs for version $VERSION..."
    - |
      python3 scripts/generate_ansible_changelog.py \
        /tmp/ansible-module-old/ansible_waldur_module \
        ${CI_PROJECT_DIR}/outputs \
        --version "$VERSION" > collection-changelogs.json
    - echo "--- Generated Changelogs (JSON) ---"
    - cat collection-changelogs.json
    - echo "-----------------------------------"

    - |
      OLD_COLLECTIONS_ROOT="/tmp/ansible-module-old/ansible_waldur_module/ansible_collections"
      NEW_COLLECTIONS_ROOT="${CI_PROJECT_DIR}/outputs/ansible_collections"

      ALL_COLLECTIONS=""
      for ROOT in "$OLD_COLLECTIONS_ROOT" "$NEW_COLLECTIONS_ROOT"; do
        if [ -d "$ROOT" ]; then
          for DIR in "$ROOT"/*/*; do
            [ -d "$DIR" ] || continue
            REL="${DIR#$ROOT/}"
            echo "$ALL_COLLECTIONS" | grep -qx "$REL" || ALL_COLLECTIONS="$ALL_COLLECTIONS
      $REL"
          done
        fi
      done

      for RELATIVE_PATH in $ALL_COLLECTIONS; do
        [ -z "$RELATIVE_PATH" ] && continue
        COLLECTION_NAME=$(echo "$RELATIVE_PATH" | tr '/' '.')
        NEW_README="$NEW_COLLECTIONS_ROOT/$RELATIVE_PATH/README.md"
        OLD_README="$OLD_COLLECTIONS_ROOT/$RELATIVE_PATH/README.md"

        NEW_CHANGELOG=""
        if [ -s "collection-changelogs.json" ] && [ "$(jq 'length' collection-changelogs.json)" -gt 0 ]; then
          CONTENT=$(jq -r ".[\"$COLLECTION_NAME\"] // empty" collection-changelogs.json)
          if [ -n "$CONTENT" ]; then
            NEW_CHANGELOG="$CONTENT"
          fi
        fi

        OLD_CHANGELOG=""
        if [ -f "$OLD_README" ] && grep -q "^## Breaking Changes for [0-9]" "$OLD_README"; then
          OLD_CHANGELOG=$(sed -n '/^## Breaking Changes for [0-9]/,/^# Waldur Ansible Collection:/{ /^# Waldur Ansible Collection:/d; p; }' "$OLD_README")
        fi

        if [ -z "$NEW_CHANGELOG" ] && [ -z "$OLD_CHANGELOG" ]; then
          continue
        fi

        [ ! -f "$NEW_README" ] && continue

        echo "Updating README for $COLLECTION_NAME"

        {
          if [ -n "$NEW_CHANGELOG" ]; then
            echo "$NEW_CHANGELOG"
            echo ""
            echo "---"
            echo ""
          fi
          if [ -n "$OLD_CHANGELOG" ]; then
            echo "$OLD_CHANGELOG"
          fi
          cat "$NEW_README"
        } > "${NEW_README}.tmp" && mv "${NEW_README}.tmp" "$NEW_README"
      done
  artifacts:
    paths:
      - outputs/
    expire_in: 1 day

Upload Collection:
  stage: postdeploy
  extends: .base_job
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  image:
    name: registry.hpc.ut.ee/mirror/alpine/git:latest
    entrypoint: [""]
  needs:
    - job: Generate Collection
    - job: Generate Collection Changelog
      optional: true
  before_script:
    - *build_before_script
  script:
    - cd /tmp/
    - git clone --depth 1 --branch main git@github.com:waldur/ansible-waldur-module-next.git
    - cd ansible-waldur-module-next
    - rm -rf ansible_waldur_module && mkdir -p ansible_waldur_module
    - cp -a "$CI_PROJECT_DIR/outputs/." ansible_waldur_module/

    - |
      git add ansible_waldur_module/
      if git diff-index --quiet HEAD --; then
        echo "No changes to commit. Exiting."
        exit 0
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      elif [ -n "$RELEASE_VERSION" ]; then
        VERSION="$RELEASE_VERSION"
      else
        VERSION=""
      fi
      if [ -n "$VERSION" ]; then
        echo "Committing and tagging stable release $VERSION"
        git commit -m "Release: update modules for version $VERSION"
        git push origin main
        git tag -a $VERSION -m "Release $VERSION"
        git push origin $VERSION
      else
        echo "Committing development update"
        git commit -m "Update Ansible Waldur modules from develop branch"
        git push origin main
      fi

Publish Galaxy:
  stage: postdeploy
  extends: .base_job
  # galaxy.ansible.com intermittently returns HTTP 500 on publish, which surfaces
  # as a script_failure and was the dominant pipeline false-red (~28% of runs on
  # main). Retry the transient publish instead of reding the whole pipeline.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - script_failure
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  image:
    name: registry.hpc.ut.ee/mirror/library/python:3.12-bullseye
  needs:
    - job: Generate Collection
    - job: Generate Collection Changelog
      optional: true
  before_script:
    - apt-get update && apt-get install -y jq
    - pip install yq ansible
  script:
    - echo "--- Discovering and Publishing Ansible Collections ---"
    - COLLECTIONS_ROOT="outputs/ansible_collections"

    - |
      if [ ! -d "$COLLECTIONS_ROOT" ]; then
        echo "ERROR: Collections root '$COLLECTIONS_ROOT' not found in artifacts."
        exit 1
      fi

    - |
      find "$COLLECTIONS_ROOT" -name "galaxy.yml" | while read GALAXY_FILE; do
        COLLECTION_PATH=$(dirname "${GALAXY_FILE}")

        echo "=========================================================="
        echo "Processing Collection at: ${COLLECTION_PATH}"
        echo "=========================================================="

        NAMESPACE=$(yq '.namespace' "${GALAXY_FILE}" | tr -d '"')
        NAME=$(yq '.name' "${GALAXY_FILE}" | tr -d '"')
        VERSION=$(yq '.version' "${GALAXY_FILE}" | tr -d '"')

        echo "Found Collection: ${NAMESPACE}.${NAME} version ${VERSION}"

        if [ -z "$NAMESPACE" ] || [ -z "$NAME" ] || [ -z "$VERSION" ]; then
          echo "ERROR: Could not parse details from ${GALAXY_FILE}. Skipping."
          continue
        fi

        echo "--- Building collection: ${NAMESPACE}.${NAME} ---"
        (
          cd "${COLLECTION_PATH}"
          ansible-galaxy collection build --force
        )

        ARCHIVE_FILE_NAME="${NAMESPACE}-${NAME}-${VERSION}.tar.gz"
        ARCHIVE_FILE_PATH="${COLLECTION_PATH}/${ARCHIVE_FILE_NAME}"

        echo "--- Publishing archive: ${ARCHIVE_FILE_PATH} ---"

        if [ ! -f "${ARCHIVE_FILE_PATH}" ]; then
          echo "ERROR: Expected archive file not found at ${ARCHIVE_FILE_PATH}. Checking parent directory..."
          ARCHIVE_FILE_PATH_PARENT="$(dirname "${COLLECTION_PATH}")/${ARCHIVE_FILE_NAME}"
          if [ -f "${ARCHIVE_FILE_PATH_PARENT}" ]; then
            ARCHIVE_FILE_PATH="${ARCHIVE_FILE_PATH_PARENT}"
            echo "Found archive at: ${ARCHIVE_FILE_PATH}"
          else
            echo "ERROR: Archive file not found. Skipping."
            continue
          fi
        fi

        if [ -z "$ANSIBLE_GALAXY_TOKEN" ]; then
          echo "ERROR: ANSIBLE_GALAXY_TOKEN is not set or is empty. Cannot publish collection."
          exit 1
        fi

        echo "Publishing ${ARCHIVE_FILE_NAME} to Ansible Galaxy..."
        ansible-galaxy collection publish --api-key "$ANSIBLE_GALAXY_TOKEN" "${ARCHIVE_FILE_PATH}"
        echo "Successfully published ${ARCHIVE_FILE_NAME} to Ansible Galaxy."
        echo ""
      done
    - echo "--- All collections processed ---"

# Fails when a dependency arrives under a licence Waldur cannot ship — strong
# copyleft (GPL, AGPL), source-available (SSPL, BUSL, Elastic) or non-OSI
# use-restricted (Hippocratic, JSON). LGPL and MPL pass but stay listed in the
# job artifact. See waldur/waldur-mastermind#285.
#
# This package and the generated collections are GPL-3.0-or-later (they cannot
# exist without `AnsibleModule` from GPL-licensed ansible-core), so GPL
# dependencies are compatible and the gate is enforced.
Check dependency licences:
  extends: .Licence gate (python) template
  allow_failure: false
